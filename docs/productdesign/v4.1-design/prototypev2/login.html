<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · DataGear 能源BI</title>
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  body { overflow: hidden; }
  .login-wrap { display: flex; height: 100vh; position: relative; z-index: 1; }

  /* ---------- 左侧品牌区 ---------- */
  .brand-pane {
    width: 55%; height: 100%; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 52px 60px 30px;
    background:
      radial-gradient(760px 420px at 18% 12%, rgba(255,138,61,.16), transparent 62%),
      radial-gradient(680px 460px at 88% 84%, rgba(34,211,238,.10), transparent 62%),
      radial-gradient(520px 360px at 60% 55%, rgba(167,139,250,.07), transparent 65%),
      linear-gradient(160deg, #0B1220 0%, #070A12 70%);
    border-right: 1px solid var(--line-1);
  }
  .brand-pane::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(70% 60% at 45% 42%, #000 30%, transparent 100%);
  }
  .brand-top { display: flex; align-items: center; gap: 12px; position: relative; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 11px; background: var(--brand-grad);
    display: flex; align-items: center; justify-content: center;
    color: #1A0E05; font-weight: 800; font-size: 17px; font-family: var(--font-num);
    box-shadow: var(--shadow-glow-brand);
  }
  .brand-top .b-name { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .brand-top .b-name em { font-style: normal; color: var(--brand); }
  .brand-top .b-ver {
    font-size: 10.5px; color: var(--tx-3); letter-spacing: 1.5px;
    border: 1px solid var(--line-2); border-radius: 10px; padding: 2px 9px; font-family: var(--font-num);
  }
  .brand-mid { position: relative; max-width: 560px; }
  .brand-mid h1 {
    font-size: 46px; font-weight: 800; line-height: 1.22; letter-spacing: 1px;
    background: linear-gradient(120deg, #FFF3E6 0%, #FFB25E 38%, #FF8A3D 62%, #F4633A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 16px;
  }
  .brand-mid .slogan { font-size: 16.5px; color: var(--tx-2); letter-spacing: .5px; }
  .brand-mid .slogan b { color: var(--tx-1); font-weight: 600; }
  .ind-chips { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .ind-chips .ind { font-size: 12.5px; padding: 5px 13px; border-radius: 14px; }
  .brand-feats { display: flex; gap: 26px; margin-top: 34px; position: relative; flex-wrap: wrap; }
  .brand-feats .feat { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tx-2); }
  .brand-feats .feat svg { width: 16px; height: 16px; color: var(--ok); flex: none; }
  .brand-kpis {
    position: relative; display: flex; gap: 38px; padding: 18px 22px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line-1);
    border-radius: var(--r-l); backdrop-filter: blur(8px); width: fit-content;
  }
  .brand-kpis .k .k-v { font-family: var(--font-num); font-size: 22px; font-weight: 700; color: var(--tx-1); }
  .brand-kpis .k .k-v i { font-style: normal; color: var(--brand); }
  .brand-kpis .k .k-l { font-size: 11.5px; color: var(--tx-3); margin-top: 1px; }

  /* ---------- 右侧登录区 ---------- */
  .form-pane {
    flex: 1; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 24px 0;
    background: radial-gradient(560px 320px at 80% -6%, rgba(255,138,61,.07), transparent 60%);
  }
  .login-card {
    width: 400px; max-width: 100%; background: var(--bg-glass);
    border: 1px solid var(--line-2); border-radius: var(--r-xl);
    padding: 34px 34px 28px; backdrop-filter: blur(12px); box-shadow: var(--shadow-2);
  }
  .login-card h2 { font-size: 21px; font-weight: 700; }
  .login-card .lc-sub { font-size: 12.5px; color: var(--tx-3); margin: 4px 0 24px; }
  .login-card .form-label { font-size: 12.5px; }
  .login-card .input { padding: 11px 14px; font-size: 13.5px; }
  .pwd-wrap { position: relative; }
  .pwd-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; background: none; cursor: pointer;
    color: var(--tx-4); display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .pwd-eye:hover { color: var(--tx-1); }
  .pwd-eye svg { width: 16px; height: 16px; }
  .captcha-row { display: flex; gap: 10px; }
  .captcha-row .input { flex: 1; }
  .captcha-box {
    width: 128px; height: 46px; flex: none; border-radius: var(--r-m); cursor: pointer;
    border: 1px solid var(--line-2); position: relative; overflow: hidden;
    background:
      radial-gradient(60px 30px at 20% 30%, rgba(255,138,61,.35), transparent 70%),
      radial-gradient(50px 26px at 78% 70%, rgba(34,211,238,.3), transparent 70%),
      var(--bg-3);
    display: flex; align-items: center; justify-content: center;
  }
  .captcha-box span {
    font-family: var(--font-mono); font-size: 20px; font-weight: 700;
    letter-spacing: 5px; color: var(--tx-1);
    text-shadow: 1px 0 0 rgba(34,211,238,.6), -1px 0 0 rgba(255,138,61,.6);
  }
  .captcha-box i { position: absolute; left: -10%; right: -10%; height: 1px; background: rgba(255,255,255,.22); }
  .login-opts { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  .login-opts .remember { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tx-2); cursor: pointer; }
  .login-btn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
  .login-links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12.5px; }
  .sso-row { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .sso-row .line { flex: 1; height: 1px; background: var(--line-1); }
  .sso-row span { font-size: 11px; color: var(--tx-4); }
  .sso-btns { display: flex; gap: 10px; margin-top: 12px; }
  .sso-btns .btn { flex: 1; justify-content: center; font-size: 12px; padding: 6px 0; }

  /* ---------- 底部通栏 ---------- */
  .login-foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; font-size: 11.5px; color: var(--tx-4);
    border-top: 1px solid var(--line-1);
    background: rgba(7,10,18,.6); backdrop-filter: blur(10px);
  }
  .login-foot .xc { display: flex; gap: 6px; align-items: center; }
  .login-foot .xc .tag { font-size: 10.5px; padding: 1px 7px; }
  @media (max-width: 960px) { .brand-pane { display: none; } .form-pane { background: none; } }
</style>
</head>
<body data-no-shell>
<div class="login-wrap">
  <!-- 左侧品牌区 -->
  <div class="brand-pane">
    <div class="brand-top">
      <div class="brand-mark">DG</div>
      <div class="b-name">DataGear <em>能源BI</em></div>
      <span class="b-ver">V4.1</span>
    </div>

    <div class="brand-mid">
      <h1>语义层驱动的<br/>一站式能源数据智能平台</h1>
      <div class="slogan">从数据源到指标、看板、报表与 AI 问数 —— <b>开源 · 可私有化 · 信创全栈适配</b></div>
      <div class="ind-chips">
        <span class="ind oil"><i></i>石油</span>
        <span class="ind gas"><i></i>天然气</span>
        <span class="ind chem"><i></i>化工</span>
        <span class="ind coal"><i></i>煤矿</span>
      </div>
      <div class="brand-feats">
        <span class="feat" id="feat1"></span>
        <span class="feat" id="feat2"></span>
        <span class="feat" id="feat3"></span>
      </div>
    </div>

    <div class="brand-kpis">
      <div class="k"><div class="k-v"><i>86</i></div><div class="k-l">语义指标</div></div>
      <div class="k"><div class="k-v">148</div><div class="k-l">数据集</div></div>
      <div class="k"><div class="k-v">64</div><div class="k-l">行业看板</div></div>
      <div class="k"><div class="k-v">4<i>+</i></div><div class="k-l">信创数据库</div></div>
    </div>
  </div>

  <!-- 右侧登录卡 -->
  <div class="form-pane">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <div class="lc-sub">登录 DataGear 能源BI 工作台（演示原型 · 任意账号 + 正确验证码可登录）</div>

      <div class="form-item">
        <label class="form-label">账号</label>
        <input class="input" id="inAcc" value="liming@huabei.oil" placeholder="请输入账号 / 手机号" />
        <div class="field-error hidden" id="errAcc"></div>
      </div>
      <div class="form-item">
        <label class="form-label">密码</label>
        <div class="pwd-wrap">
          <input class="input" id="inPwd" type="password" value="datagear2026" placeholder="请输入密码" style="padding-right:40px" />
          <button type="button" class="pwd-eye" id="eyeBtn" title="显示 / 隐藏密码"></button>
        </div>
        <div class="field-error hidden" id="errPwd"></div>
      </div>
      <div class="form-item">
        <label class="form-label">验证码</label>
        <div class="captcha-row">
          <input class="input" id="inCap" placeholder="输入右侧字符（不区分大小写）" autocomplete="off" />
          <div class="captcha-box" id="capBox" title="点击刷新">
            <i id="capL1"></i>
            <i id="capL2"></i>
            <span id="capTxt"></span>
          </div>
        </div>
        <div class="field-error hidden" id="errCap"></div>
      </div>

      <div class="login-opts">
        <label class="remember"><label class="switch"><input type="checkbox" checked /><i></i></label>记住我</label>
        <a href="javascript:void(0)" onclick="DG.ui.toast('忘记密码：请联系组织管理员或走邮件找回（FR-AUTH-01）','ok')">忘记密码？</a>
      </div>

      <button class="btn primary lg login-btn" id="btnLogin">登 录</button>

      <div class="sso-row"><span class="line"></span><span>其他登录方式</span><span class="line"></span></div>
      <div class="sso-btns">
        <button class="btn" data-sso="企业微信">企业微信</button>
        <button class="btn" data-sso="钉钉">钉钉</button>
        <button class="btn" data-sso="SSO">SSO</button>
      </div>

      <div class="login-links">
        <a href="javascript:void(0)" onclick="DG.ui.toast('注册需企业管理员审核（FR-AUTH-02）','warn')">注册账号</a>
        <a href="https://datagear.tech" target="_blank" rel="noopener">访问官网文档</a>
      </div>
    </div>
    <div style="height:52px"></div>
  </div>
</div>

<!-- 底部通栏 -->
<div class="login-foot">
  <span>开源协议 <span class="tag brand" style="margin-left:4px">LGPL-3.0</span></span>
  <span class="xc">信创适配：
    <span class="tag">达梦 DM8</span><span class="tag">金仓 KingbaseES</span><span class="tag">麒麟 OS</span><span class="tag">统信 UOS</span>
  </span>
  <span>© 2026 DataGear Open Source Community</span>
</div>

<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/mock-api.js"></script>
<script>
  const feats = [
    ['safe', '开源免费 · LGPL 协议'],
    ['db', '私有化部署 · 数据不出域'],
    ['govern', '信创全适配 · 国产化生态'],
  ];
  feats.forEach((f, i) => {
    document.getElementById('feat' + (i + 1)).innerHTML = DG.ICONS[f[0]] + f[1];
  });

  /* ================= 验证码（随机 4 字符 + 干扰线，点击刷新） ================= */
  const CAP_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let capCode = '';
  function drawCaptcha() {
    capCode = Array.from({ length: 4 }, () => CAP_CHARS[Math.floor(Math.random() * CAP_CHARS.length)]).join('');
    const txt = document.getElementById('capTxt');
    txt.textContent = capCode;
    txt.style.transform = `rotate(${(Math.random() * 10 - 5).toFixed(1)}deg)`;
    const l1 = document.getElementById('capL1'), l2 = document.getElementById('capL2');
    l1.style.cssText = `top:${22 + Math.random() * 20}%;transform:rotate(${Math.random() * 14 - 7}deg)`;
    l2.style.cssText = `top:${55 + Math.random() * 22}%;transform:rotate(${Math.random() * 14 - 7}deg)`;
  }
  drawCaptcha();
  document.getElementById('capBox').onclick = () => { drawCaptcha(); document.getElementById('inCap').value = ''; hideErr('errCap', 'inCap'); };

  /* ================= 密码明文 / 密文切换 ================= */
  const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.9 3.9M6.1 6.1A16.6 16.6 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.3-1"/></svg>';
  const eyeBtn = document.getElementById('eyeBtn');
  eyeBtn.innerHTML = EYE_OFF;
  eyeBtn.onclick = () => {
    const pwd = document.getElementById('inPwd');
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eyeBtn.innerHTML = show ? EYE_ON : EYE_OFF;
  };

  /* ================= 登录校验 + 提交（POST /auth/login） ================= */
  function showErr(errId, inId, msg) {
    const e = document.getElementById(errId);
    e.textContent = msg; e.classList.remove('hidden');
    document.getElementById(inId).classList.add('err');
  }
  function hideErr(errId, inId) {
    document.getElementById(errId).classList.add('hidden');
    document.getElementById(inId).classList.remove('err');
  }
  ['inAcc', 'inPwd', 'inCap'].forEach((id, i) => {
    document.getElementById(id).addEventListener('input', () => hideErr(['errAcc', 'errPwd', 'errCap'][i], id));
  });
  async function doLogin() {
    const acc = document.getElementById('inAcc').value.trim();
    const pwd = document.getElementById('inPwd').value;
    const cap = document.getElementById('inCap').value.trim();
    let ok = true;
    if (!acc) { showErr('errAcc', 'inAcc', '账号不能为空'); ok = false; }
    if (!pwd) { showErr('errPwd', 'inPwd', '密码不能为空'); ok = false; }
    if (!cap) { showErr('errCap', 'inCap', '请输入验证码'); ok = false; }
    else if (cap.toUpperCase() !== capCode) { showErr('errCap', 'inCap', `验证码错误，请重新输入（当前为 ${capCode}）`); ok = false; }
    if (!ok) return;
    const btn = document.getElementById('btnLogin');
    DG.ui.btnLoading(btn, true);
    /* 说明：验证码为前端本地校验（占位图字符），后端 /auth/login 仅校验账号与密码 */
    const r = await DG.api.post('/auth/login', { account: acc, password: pwd });
    DG.ui.btnLoading(btn, false);
    if (r.code === 0) {
      DG.ui.toast(`登录成功，欢迎回来 ${r.data.user.name}（${r.data.user.role}）`, 'ok');
      setTimeout(() => location.href = 'index.html', 700);
    } else {
      DG.ui.toast(r.message, 'err');
      drawCaptcha();
      document.getElementById('inCap').value = '';
    }
  }
  document.getElementById('btnLogin').onclick = doLogin;
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  /* ================= 扫码免登入口 ================= */
  document.querySelectorAll('[data-sso]').forEach(b => b.onclick = () =>
    DG.ui.toast(`${b.dataset.sso} 扫码免登演示（FR-MOB 轻应用免登）`, 'ok'));

  /* #demo：演示校验失败态（填入错误验证码并触发登录） */
  if (location.hash === '#demo') setTimeout(() => {
    document.getElementById('inCap').value = '0000';
    doLogin();
  }, 400);
</script>
</body>
</html>
