<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能问数 · DataGear 能源BI</title>
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  /* 满高三栏工作台（内容区不滚动，列内滚动） */
  #content { overflow: hidden !important; }
  .chat-bench {
    display: grid; grid-template-columns: 240px 1fr 320px; gap: 14px;
    height: calc(100vh - var(--topbar-h) - 60px);
  }
  .chat-col { display: flex; flex-direction: column; min-height: 0; }

  /* 左：会话历史 */
  .hist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hist-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .hist-item {
    padding: 9px 12px; border-radius: var(--r-m); cursor: pointer; transition: background var(--dur);
    font-size: 12.5px; color: var(--tx-2);
  }
  .hist-item:hover { background: var(--bg-glass-2); }
  .hist-item.active { background: var(--brand-soft); color: var(--brand); }
  .hist-item .h-t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item .h-s { font-size: 10.5px; color: var(--tx-4); margin-top: 2px; }
  .hist-group { font-size: 10.5px; color: var(--tx-4); letter-spacing: 1px; padding: 8px 12px 4px; }

  /* 中：对话区 */
  .chat-main { display: flex; flex-direction: column; min-height: 0; padding: 0 !important; background: transparent; border: none; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 4px 6px 12px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .m-avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .msg.user .m-avatar { background: linear-gradient(135deg,#22D3EE,#0E7490); color: #04262C; }
  .msg.ai .m-avatar { background: var(--brand-grad); color: #241105; box-shadow: var(--shadow-glow-brand); }
  .msg .m-avatar svg { width: 16px; height: 16px; }
  .bubble-user {
    background: var(--brand-soft); border: 1px solid var(--brand-line);
    border-radius: 14px 4px 14px 14px; padding: 10px 14px; font-size: 13.5px;
  }
  .bubble-ai {
    background: var(--bg-glass); border: 1px solid var(--line-1);
    border-radius: 4px 14px 14px 14px; padding: 14px 16px; flex: 1; min-width: 0;
  }
  .bubble-ai .m-time { font-size: 10.5px; color: var(--tx-4); margin-top: 10px; }
  .ai-conclusion { font-size: 13.5px; line-height: 1.75; }
  .ai-conclusion b { color: var(--brand); font-family: var(--font-num); }
  .ai-ops { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ai-table { margin-top: 12px; }
  .ai-table .tbl thead th { padding: 8px 10px; font-size: 11.5px; }
  .ai-table .tbl tbody td { padding: 8px 10px; font-size: 12.5px; }
  .attr-card {
    margin-top: 12px; border: 1px solid var(--line-1); border-radius: var(--r-m);
    background: rgba(255,255,255,.02); padding: 12px 14px;
  }
  .attr-card .a-t { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .attr-card .a-t svg { width: 14px; height: 14px; color: var(--brand); }
  .attr-row { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 4px 0; }
  .attr-row .a-name { width: 76px; flex: none; color: var(--tx-2); }
  .attr-row .progress { flex: 1; }
  .attr-row .a-v { width: 74px; text-align: right; font-family: var(--font-num); color: var(--tx-1); }
  .attr-top { font-size: 10.5px; color: var(--brand); border: 1px solid var(--brand-line); border-radius: 6px; padding: 0 6px; margin-left: 6px; }

  /* 底部输入 */
  .chat-input-wrap { flex: none; padding-top: 12px; }
  .chips { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--tx-2); padding: 5px 12px; border-radius: 14px; cursor: pointer;
    background: var(--bg-glass); border: 1px solid var(--line-1); transition: all var(--dur);
  }
  .chip:hover { border-color: var(--brand-line); color: var(--brand); }
  .chat-input {
    display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px;
    background: rgba(7,10,18,.6); border: 1px solid var(--line-2); border-radius: 18px;
  }
  .chat-input:focus-within { border-color: var(--brand-line); box-shadow: var(--shadow-glow-brand); }
  .chat-input input { flex: 1; background: none; border: none; outline: none; color: var(--tx-1); font-size: 13.5px; font-family: var(--font); }
  .chat-input input::placeholder { color: var(--tx-4); }
  .send-btn {
    width: 36px; height: 36px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--brand-grad); color: #241105;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(244,99,58,.35);
  }
  .send-btn svg { width: 17px; height: 17px; }

  /* 右：取数透明化面板 */
  .trace-panel { padding: 14px 16px; overflow-y: auto; }
  .trace-step { position: relative; padding-left: 26px; padding-bottom: 18px; }
  .trace-step::before {
    content: ""; position: absolute; left: 8px; top: 20px; bottom: -2px;
    width: 1px; background: var(--line-2);
  }
  .trace-step:last-child::before { display: none; }
  .trace-step .ts-dot {
    position: absolute; left: 0; top: 2px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--brand-soft); border: 1px solid var(--brand-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-family: var(--font-num); color: var(--brand); font-weight: 700;
  }
  .trace-step .ts-t { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .ts-kv { font-size: 11.5px; color: var(--tx-2); line-height: 1.8; }
  .ts-kv b { color: var(--tx-1); }
  .ts-kv .k { color: var(--tx-3); }
  .code-block {
    background: rgba(5,8,14,.8); border: 1px solid var(--line-1); border-radius: var(--r-m);
    padding: 10px 12px; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7;
    color: #C9D4E8; overflow-x: auto; white-space: pre; margin-top: 6px;
  }
  .code-block .kw { color: #FF8A3D; }
  .code-block .fn { color: #22D3EE; }
  .code-block .cm { color: #525D75; }
  .code-block .pc { color: #E8B33C; }
  .code-block .st { color: #34D399; }

  @media (max-width: 1200px) { .chat-bench { grid-template-columns: 200px 1fr; } .chat-col.right { display: none; } }
</style>
</head>
<body data-page="chatbi">
<div id="page-content" style="display:none">

  <div class="chat-bench">
    <!-- 左：会话历史（GET /ai/session/list） -->
    <div class="card chat-col">
      <div class="hist-head">
        <b style="font-size:13.5px">会话历史</b>
        <button class="btn sm primary" id="btnNewSess"><span style="width:13px;height:13px;display:flex" id="ic-plus"></span>新会话</button>
      </div>
      <div class="hist-list" id="histList"><div class="block-loading"><span class="spin"></span> 加载中…</div></div>
    </div>

    <!-- 中：对话主区 -->
    <div class="chat-col chat-main">
      <div class="flex wrap" style="gap:8px;flex:none;padding:2px 6px 12px">
        <span class="tag brand" id="llmTag" style="cursor:pointer" title="点击查看 BYO-LLM 接入配置"></span>
        <span class="tag info">语义层已连接 · 86 指标</span>
        <span class="tag ok">行级权限继承开启</span>
        <span class="tag" style="margin-left:auto">取数透明化已开启</span>
      </div>
      <div id="ctxBar" class="hidden" style="flex:none;align-items:center;gap:8px;margin:0 6px 10px;padding:6px 12px;background:var(--info-soft);border:1px solid rgba(96,165,250,.3);border-radius:10px;font-size:12px;color:var(--tx-2)">
        <span style="color:var(--info);width:14px;height:14px;display:flex;flex:none" id="ic-ctx"></span>
        <span>当前上下文：<b id="ctxText" style="color:var(--tx-1)">—</b> <span class="sm tx-3">（追问将继承该时空与维度口径）</span></span>
        <span id="ctxClear" title="清除上下文" style="margin-left:auto;cursor:pointer;color:var(--tx-3);width:14px;height:14px;display:flex;flex:none"></span>
      </div>
      <div class="chat-scroll" id="chatScroll">

</div>

      <!-- 输入区 -->
      <div class="chat-input-wrap">
        <div class="chips" id="recChips">
          <span class="chip">今日原煤产量</span>
          <span class="chip">甲醇装置开工率趋势</span>
          <span class="chip">瓦斯超限次数排名</span>
          <span class="chip">管输量月度计划完成率</span>
        </div>
        <div class="chat-input">
          <input id="askInput" placeholder="用业务语言提问，如「上月各采油厂原油产量同比？」— 将自动命中语义层指标" />
          <button class="send-btn" id="sendBtn" title="发送"><span style="width:17px;height:17px;display:flex" id="ic-send"></span></button>
        </div>
      </div>
    </div>

    <!-- 右：取数逻辑透明化（每次回答后更新，步骤可点击折叠） -->
    <div class="card chat-col right trace-panel">
      <div class="card-title" style="margin-bottom:14px"><span class="bar"></span>取数逻辑透明化 <span class="tag brand" style="margin-left:auto">FR-AI</span></div>
      <div id="traceBody">
        <div class="sm tx-3" style="line-height:1.9;padding:6px 2px">发起提问后，此处将逐步展示 <b style="color:var(--tx-1)">意图识别 → DSL 落地 → SQL 编译 → 权限继承 → 执行缓存</b> 全过程；每一步骤标题可点击折叠 / 展开。</div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/vendor/echarts.min.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/mock-api.js"></script>
<script>
document.getElementById('ic-plus').innerHTML = DG.ICONS.plus;
document.getElementById('ic-send').innerHTML = DG.ICONS.arrowR;
document.getElementById('ic-ctx').innerHTML = DG.ICONS.drill;
document.getElementById('ctxClear').innerHTML = DG.ICONS.x;
document.getElementById('llmTag').textContent = 'DeepSeek-V3 · BYO-LLM 接入';
const esc = DG.ui.esc;
const chatScroll = document.getElementById('chatScroll');
const askInput = document.getElementById('askInput');
let answered = 0, ctx = null;

/* ================= 气泡基础 ================= */
function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }
function userBubble(q) {
  const m = DG.ui.el(`<div class="msg user"><div class="m-avatar">李明</div><div class="bubble-user"></div></div>`);
  m.querySelector('.bubble-user').textContent = q;
  chatScroll.appendChild(m); scrollBottom();
}
function aiShell() {
  const m = DG.ui.el(`<div class="msg ai"><div class="m-avatar">${DG.ICONS.spark}</div><div class="bubble-ai"></div></div>`);
  chatScroll.appendChild(m); scrollBottom();
  return m.querySelector('.bubble-ai');
}
function aiSkeleton() {
  const b = aiShell();
  b.innerHTML = `<div class="flex" style="gap:8px;color:var(--tx-3);font-size:12.5px"><span class="spin"></span>正在经语义层取数：意图识别 → DSL 落地 → SQL 编译…</div>
    <div class="skeleton" style="height:13px;margin-top:12px"></div>
    <div class="skeleton" style="height:13px;width:84%;margin-top:8px"></div>
    <div class="skeleton" style="height:13px;width:62%;margin-top:8px"></div>`;
  scrollBottom();
  return b;
}

/* ================= 答案渲染（结论 + ECharts + 数据表 + 操作行 + 归因卡） ================= */
function dimLabel(a) { return a.metric.indexOf('OIL') > -1 ? '采油厂' : a.metric.indexOf('COAL') > -1 ? '矿区 / 工作面' : '月份'; }
function chartOptOf(a) {
  const isTime = a.dims.every(d => String(d).endsWith('月'));
  if (isTime) return {
    tooltip: { trigger: 'axis' }, legend: { data: ['本期', '去年同期'] }, grid: { top: 30 },
    xAxis: { type: 'category', data: a.dims }, yAxis: { type: 'value' },
    series: [
      { name: '本期', type: 'line', smooth: true, symbolSize: 6, lineStyle: { width: 2.4, color: '#FF8A3D' }, itemStyle: { color: '#FF8A3D' }, data: a.values,
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(255,138,61,.22)' }, { offset: 1, color: 'rgba(255,138,61,0)' }] } } },
      { name: '去年同期', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 1.6, type: 'dashed', color: '#7C88A0' }, data: a.lastYear }
    ]
  };
  const yoyNum = a.yoy.map(y => { const v = parseFloat(y); return isNaN(v) ? null : v; });
  return {
    tooltip: { trigger: 'axis' }, legend: { data: ['本期', '同比(%)'] }, grid: { top: 30 },
    xAxis: { type: 'category', data: a.dims.map(d => String(d).replace('采油厂', '').replace('矿区', '')) },
    yAxis: [{ type: 'value' }, { type: 'value', splitLine: { show: false } }],
    series: [
      { name: '本期', type: 'bar', barWidth: 26, data: a.values,
        itemStyle: { borderRadius: [5, 5, 0, 0], color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#FF8A3D' }, { offset: 1, color: 'rgba(244,99,58,.35)' }] } } },
      { name: '同比(%)', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 7, lineStyle: { width: 2.2, color: '#22D3EE' }, itemStyle: { color: '#22D3EE' }, data: yoyNum }
    ]
  };
}
function renderAnswer(b, a, opts) {
  opts = opts || {};
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  b.innerHTML = `
    <div class="ai-conclusion">${a.conclusion}</div>
    <div class="chart" style="height:230px;margin-top:10px"></div>
    <div class="ai-table table-wrap"><table class="tbl">
      <thead><tr><th>${dimLabel(a)}</th><th class="num">本期</th><th class="num">去年同期</th><th class="num">同比</th><th>主要驱动</th></tr></thead>
      <tbody>${a.dims.map((d, i) => `<tr><td class="cell-main">${d}</td><td class="num">${a.values[i]}</td><td class="num">${a.lastYear[i]}</td><td class="num" style="color:${String(a.yoy[i]).indexOf('-') === 0 ? 'var(--danger)' : 'var(--ok)'}">${a.yoy[i]}</td><td>${a.drivers[i] || '—'}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="attr-card">
      <div class="a-t">${DG.ICONS.spark} 波动归因 · 维度贡献度</div>
      <div class="attr-rows"><div class="sm tx-3">归因引擎计算中…（POST /ai/insight/attribute）</div></div>
    </div>
    <div class="ai-ops">
      <button class="btn sm" data-op="board">转为看板</button>
      <button class="btn sm" data-op="excel">导出 Excel</button>
      <button class="btn sm ghost" data-op="fav">☆ 收藏</button>
      <button class="btn sm ghost" data-op="fb">纠错反馈</button>
    </div>
    <div class="m-time">${t} · 命中语义层指标「${a.title} ${a.metric}」${opts.costMs ? ' · 耗时 ' + opts.costMs + 'ms' : ''}</div>`;
  scrollBottom();
  DG.makeChart(b.querySelector('.chart'), chartOptOf(a));
  DG.api.post('/ai/insight/attribute', { metric: a.metric }).then(r => {
    if (r.code !== 0 || !b.isConnected) return;
    const rows = b.querySelector('.attr-rows');
    if (!rows) return;
    rows.innerHTML = r.data.map((x, i) => `
      <div class="attr-row"><span class="a-name">${x.dim}</span>
        <div class="progress"><i style="width:${x.pct}%;${i === 0 ? '' : 'background:linear-gradient(90deg,#22D3EE,#0E7490)'}"></i></div>
        <span class="a-v">贡献 ${x.pct}%${i === 0 ? '<span class="attr-top">Top</span>' : ''}</span></div>`).join('');
    scrollBottom();
  });
  b.querySelectorAll('[data-op]').forEach(btn => btn.onclick = () => {
    const op = btn.dataset.op;
    if (op === 'board') openSaveAsChart(a);
    else if (op === 'excel') DG.ui.toast(`已导出「问数-${a.title}.xlsx」（含数据表与编译 SQL）`, 'ok');
    else if (op === 'fav') {
      DG.api.post('/collab/favorite/toggle', { id: a.metric }).then(r => {
        if (r.code === 0) { btn.innerHTML = '★ 已收藏'; btn.style.color = 'var(--brand)'; DG.ui.toast('已收藏到「我的收藏」', 'ok'); }
        else DG.ui.toast(r.message, 'err');
      });
    }
    else if (op === 'fb') openFeedback(a);
  });
}

/* ---- 追问（归因答复） ---- */
function renderFollowup(b, f) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const html = esc(f.a).replace(/([+-]?\d+(\.\d+)?\s*(万吨|pct|%|口|个))/g, '<b>$1</b>');
  b.innerHTML = `
    <div class="ai-conclusion">${html}</div>
    <div class="chart" style="height:170px;margin-top:10px"></div>
    <div class="ai-ops">
      <button class="btn sm" data-op="drill">下钻安塞区块</button>
      <button class="btn sm ghost" data-op="sub">订阅异动告警</button>
    </div>
    <div class="m-time">${t} · 归因引擎 v2（维度拆解 + 基数修正）</div>`;
  DG.makeChart(b.querySelector('.chart'), {
    tooltip: { trigger: 'axis' }, legend: { data: ['长庆日产量(吨)', '去年同期'] }, grid: { top: 30 },
    xAxis: { type: 'category', data: ['7/25', '8/1', '8/6', '8/11', '8/16', '8/21', '8/26', '8/31'], axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', name: '吨/日', nameTextStyle: { color: '#7C88A0', fontSize: 10 } },
    series: [
      { name: '长庆日产量(吨)', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2.2, color: '#FF8A3D' },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(255,138,61,.25)' }, { offset: 1, color: 'rgba(255,138,61,0)' }] } },
        data: [29800, 30500, 31200, 30800, 31600, 32100, 31900, 32400] },
      { name: '去年同期', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 1.6, type: 'dashed', color: '#7C88A0' }, data: [27600, 27500, 27800, 27700, 27900, 28100, 28000, 28200] }
    ]
  });
  b.querySelector('[data-op="drill"]').onclick = () => DG.ui.toast('已下钻至安塞区块单井明细（FR-AI-06 多轮下钻）');
  b.querySelector('[data-op="sub"]').onclick = () => DG.ui.toast('已订阅「长庆产量异动」告警，将推送至企业微信（FR-ALERT-02）', 'ok');
  scrollBottom();
}

/* ================= 澄清（type=clarify → 可点选项 → /ai/chat/clarify） ================= */
function renderClarify(b, d) {
  b.innerHTML = `<div class="ai-conclusion">${esc(d.message)}</div>
    <div class="chips" style="margin-top:10px">${d.options.map(o => `<span class="chip">${esc(o)}</span>`).join('')}</div>`;
  b.querySelectorAll('.chip').forEach(c => c.onclick = () => clarifyAsk(c.textContent));
  scrollBottom();
}
async function clarifyAsk(q) {
  userBubble(q);
  const b = aiSkeleton();
  const r = await DG.api.post('/ai/chat/clarify', { question: q });
  if (r.code !== 0) { b.innerHTML = `<div class="ai-conclusion" style="color:var(--danger)">服务异常：${esc(r.message)}</div>`; scrollBottom(); return; }
  answered++;
  renderAnswer(b, r.data, { costMs: r.data.explain && r.data.explain.costMs });
  ctx = '上月（2026-08） · 采油厂维度';
  updateTrace(r.data);
}

/* ================= 发问主流程（发送按钮 / 回车 / 推荐 chips / ?q=） ================= */
async function sendAsk(q) {
  q = (q == null ? askInput.value : q).trim();
  if (!q) { DG.ui.toast('请输入问题，或点击下方推荐问题', 'warn'); return; }
  askInput.value = '';
  if (answered > 0 && ctx) showCtx();   /* 追问：顶部出现上下文条 */
  userBubble(q);
  const b = aiSkeleton();
  const r = await DG.api.post('/ai/chat/ask', { question: q });
  if (r.code !== 0) { b.innerHTML = `<div class="ai-conclusion" style="color:var(--danger)">服务异常：${esc(r.message)}（可重试或换一种问法）</div>`; scrollBottom(); return; }
  const d = r.data;
  if (d.type === 'clarify') { renderClarify(b, d); return; }
  answered++;
  renderAnswer(b, d, { costMs: d.explain && d.explain.costMs });
  ctx = ctxOf(d);
  updateTrace(d);
}
function ctxOf(d) {
  if (d.metric.indexOf('COAL') > -1) return '昨日 · 矿区 / 工作面维度';
  if (d.metric.indexOf('CHEM') > -1) return '近 6 个月 · 月份维度';

}

/* ================= 取数透明化面板（每次回答后更新，步骤可折叠） ================= */
function hlSql(sql) {
  return String(sql || '-- 无').split('\n').map(line => {
    const t = esc(line);
    if (t.trim().startsWith('--')) return '<span class="cm">' + t + '</span>';
    return t.replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|BETWEEN|AND|IN|AS|DESC|DISTINCT)\b/g, '<span class="kw">$1</span>')
            .replace(/\b(SUM|AVG|COUNT|MAX|MIN)\(/g, '<span class="fn">$1</span>(')
            .replace(/\$\{[^}]*\}/g, mm => '<span class="pc">' + mm + '</span>');
  }).join('\n');
}
function updateTrace(d) {
  const e = d.explain || {};
  const dsl = e.dsl || {};
  const steps = [
    { t: '意图识别（Text2DSL）', body: `<div class="ts-kv">
        <div><span class="k">指标：</span><b>${esc(d.title)}</b> <span class="tag" style="font-family:var(--font-mono)">${e.metric || d.metric}</span></div>
        <div><span class="k">维度：</span><b>${(dsl.dimensions || []).join(' / ') || '—'}</b></div>
        <div><span class="k">时间：</span><b>${dsl.time_range ? dsl.time_range.type + ' · 粒度 ' + (dsl.time_range.granularity || '—') : '—'}</b></div>
        <div><span class="k">对比：</span><b>${dsl.compare || 'none'}</b></div>
      </div>` },
    { t: 'DSL 中间层（语义层 Grounding）', body: `<div class="code-block">${esc(JSON.stringify(dsl, null, 2))}</div>` },
    { t: '编译 SQL（指标引擎）', body: `<div class="code-block">${hlSql(e.sql || '-- 无')}</div>` },
    { t: '权限与脱敏继承', body: `<div class="ts-kv" style="margin-bottom:8px">已按你的身份自动套用数据权限，无需手工声明：</div>
        <div class="flex wrap" style="gap:6px"><span class="tag info">${esc(e.permission || '行级权限已注入')}</span><span class="tag warn">敏感列已脱敏</span><span class="tag ok">指标口径已认证</span></div>` },
    { t: '执行与缓存', body: `<div class="ts-kv">
        <div><span class="k">引擎：</span><b>StarRocks 集群（信创）</b></div>
        <div><span class="k">耗时：</span><b class="num">${e.costMs || '—'} ms</b></div>
        <div><span class="k">缓存：</span>${e.cacheHit ? '命中语义层结果缓存（TTL 10min）' : '未命中缓存，结果已写入（TTL 10min）'}</div>
      </div>` }
  ];
  const tb = document.getElementById('traceBody');
  tb.innerHTML = steps.map((s, i) => `
    <div class="trace-step">
      <div class="ts-dot">${i + 1}</div>
      <div class="ts-t" data-fold style="cursor:pointer">${s.t}<span class="sm tx-3" style="float:right;font-weight:400">折叠</span></div>
      <div class="ts-body">${s.body}</div>
    </div>`).join('');
  tb.querySelectorAll('[data-fold]').forEach(h => h.onclick = () => {
    const bd = h.nextElementSibling;
    bd.classList.toggle('hidden');
    h.querySelector('.sm').textContent = bd.classList.contains('hidden') ? '展开' : '折叠';
  });
}

/* ================= 会话历史（GET /ai/session/list） / 新会话 ================= */
async function loadSessions() {
  const list = document.getElementById('histList');
  const r = await DG.api.get('/ai/session/list');
  if (r.code !== 0) { list.innerHTML = ''; list.appendChild(DG.ui.errorBlock(r.message, loadSessions)); return; }
  list.innerHTML = '<div class="hist-group">最近会话</div>' + r.data.map((s, i) => `
    <div class="hist-item${i === 0 ? ' active' : ''}" data-t="${esc(s.title)}"><div class="h-t">${esc(s.title)}</div><div class="h-s">${s.turns} 轮问答 · ${s.time}</div></div>`).join('');
  list.querySelectorAll('.hist-item').forEach(it => it.onclick = () => {
    list.querySelectorAll('.hist-item').forEach(x => x.classList.remove('active'));
    it.classList.add('active');
    DG.ui.toast('已加载会话「' + it.dataset.t + '」（演示内容）');
    answered = 0; ctx = null;
    document.getElementById('ctxBar').classList.add('hidden');
    renderDemo();
  });
}
