<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>统计报表 · DataGear 能源BI</title>
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  .report-layout { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
  .rp-item { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line-1); border-radius: var(--r-m); margin-bottom: 10px; cursor: pointer; transition: all var(--dur); background: var(--bg-glass); }
  .rp-item:hover { border-color: var(--line-3); }
  .rp-item.active { border-color: var(--brand); background: var(--brand-soft); }
  .rp-item .r-ico { width: 36px; height: 36px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
  .rp-item .r-ico svg { width: 18px; height: 18px; }
  .rp-item .r-name { font-size: 13px; font-weight: 600; }
  .rp-item .r-sub { font-size: 11px; color: var(--tx-3); margin-top: 2px; }
  /* 工具条 */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg-glass); border: 1px solid var(--line-1); border-radius: var(--r-m); }
  .toolbar .btn svg { width: 13px; height: 13px; }
  /* 中国式复杂报表（纯 HTML 表格） */
  .report-sheet { overflow: auto; border-radius: var(--r-m); border: 1px solid var(--line-2); background: rgba(7,10,18,.5); }
  .sheet-title { text-align: center; font-size: 17px; font-weight: 700; letter-spacing: 2px; padding: 18px 0 4px; }
  .sheet-sub { text-align: center; font-size: 11.5px; color: var(--tx-3); padding-bottom: 12px; }
  .sheet-sub .u { margin: 0 18px; }
  table.sheet { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 860px; }
  .sheet th, .sheet td { border: 1px solid var(--line-2); padding: 7px 10px; text-align: center; white-space: nowrap; }
  .sheet thead th { background: rgba(255,138,61,.08); color: var(--tx-1); font-weight: 600; }
  .sheet .grp { background: rgba(255,255,255,.03); color: var(--tx-1); font-weight: 600; text-align: left; padding-left: 14px; }
  .sheet .sub { color: var(--tx-3); font-weight: 400; text-align: left; padding-left: 28px; }
  .sheet .numc { font-family: var(--font-num); text-align: right; padding-right: 12px; }
  .sheet .subtotal td { background: rgba(255,138,61,.06); font-weight: 700; color: var(--tx-1); }
  .sheet .total td { background: rgba(255,138,61,.12); font-weight: 700; color: var(--brand); }
  .sheet .bad { color: var(--danger); font-weight: 600; }
  .sheet .good { color: var(--ok); font-weight: 600; }
  /* 斜线表头 */
  .sheet .slash {
    background-image: linear-gradient(to top right, transparent 49.4%, var(--line-3) 49.4%, var(--line-3) 50.6%, transparent 50.6%) !important;
    position: relative; min-width: 108px; padding: 0 !important; height: 54px;
  }
  .sheet .slash i { position: absolute; font-style: normal; font-size: 11px; color: var(--tx-2); }
  .sheet .slash i.a { right: 8px; top: 5px; }
  .sheet .slash i.b { left: 8px; bottom: 5px; }
  .ent-bar {
    display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    background: var(--chem-soft); border: 1px solid rgba(167,139,250,.3); border-radius: var(--r-m);
    font-size: 12.5px; color: var(--tx-2);
  }
  .ent-bar svg { width: 15px; height: 15px; color: var(--chem); flex: none; }
  .ent-bar b { color: var(--chem); }
  .link { color: var(--brand); cursor: pointer; font-size: 12.5px; }
  .cf-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,.06); font-size: 12.5px; }
  @media (max-width: 1100px) { .report-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="report">
<div id="page-content" style="display:none">

  <div class="page-head">
    <div>
      <div class="page-title">统计报表</div>
      <div class="page-desc">中国式复杂报表：多级表头、合并单元格、小计合计、条件格式与填报（PRD 10.10）</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="location.href='alert.html'">订阅管理</button>
      <button class="btn primary" id="btnNewRp"><span id="plusIco" style="display:flex"></span>新建报表</button>
    </div>
  </div>

  <!-- 类型 chips（点击过滤列表） -->
  <div class="flex wrap mb-3" style="gap:8px" id="typeChips">
    <span class="seg-item active" data-t="all" style="border:1px solid var(--line-2)">全部</span>
    <span class="seg-item" data-t="分组报表" style="border:1px solid var(--line-1)">分组报表 12</span>
    <span class="seg-item" data-t="交叉报表" style="border:1px solid var(--line-1)">交叉报表 8</span>
    <span class="seg-item" data-t="电子表格" style="border:1px solid var(--line-1)">电子表格 5</span>
    <span class="seg-item" data-t="填报表单" style="border:1px solid var(--line-1)">填报表单 6</span>
  </div>

  <div class="report-layout">
    <!-- 左：报表列表（GET /report/list） -->
    <div class="card" style="padding:14px">
      <div class="card-title"><span class="bar"></span>报表清单 <span class="more" onclick="DG.ui.toast('报表目录管理属 Phase 2 能力，见 PRD 10.10','warn')">目录 ›</span></div>
      <div id="rpList"></div>
    </div>

    <!-- 右：报表预览 -->
    <div class="flex-col" style="gap:12px;min-width:0">
      <div class="toolbar" id="reportToolbar">
        <button class="btn sm" id="btnExpXls">导出 Excel</button>
        <button class="btn sm" id="btnExpPdf">导出 PDF</button>
        <button class="btn sm" id="btnPush">定时推送</button>
        <button class="btn sm" id="btnCondFmt">条件格式</button>
        <button class="btn sm" id="btnPrint">打印</button>
        <span class="sm tx-3" style="margin-left:auto;align-self:center" id="dsHint">数据源：DS_采油日报 · 参数 ${month}=2026-08 · 已按行级权限过滤</span>
      </div>

      <div class="report-sheet" id="sheetWrap"></div>
    </div>
  </div>

  <!-- 企业版说明 -->
  <div class="ent-bar mt-3">
    <span id="entIco" style="display:flex"></span>
    <span><b>企业版增值能力</b>：报表设计器、单元格公式计算、电子表格（类 Excel 在线建模）为企业版增值模块；开源版支持分组 / 交叉报表与填报表单基础能力。</span>
  </div>

</div>

<script src="assets/js/vendor/echarts.min.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/mock-api.js"></script>
<script>
  document.getElementById('plusIco').innerHTML = DG.ICONS.plus;
  document.getElementById('entIco').innerHTML = DG.ICONS.star;

  /* ================= 报表预览模板（两套预置数据） ================= */
  const SHEET_A = `
    <div class="sheet-title">2026 年 8 月 各采油厂生产情况月报</div>
    <div class="sheet-sub"><span class="u">编制单位：生产运行部</span><span class="u">单位：万吨、%</span><span class="u">报表编号：SC-2026-08</span></div>
    <table class="sheet">
      <thead>
        <tr>
          <th rowspan="3" class="slash"><i class="a">指标</i><i class="b">单位</i></th>
          <th colspan="3">原油产量</th><th colspan="3">天然气产量</th><th colspan="2">注水</th>
          <th rowspan="3">综合含水率<br/>(%)</th>
        </tr>
        <tr><th>计划</th><th>实际</th><th>完成率(%)</th><th>计划</th><th>实际</th><th>完成率(%)</th><th>计划</th><th>实际</th></tr>
        <tr><th>万吨</th><th>万吨</th><th>—</th><th>万方</th><th>万方</th><th>—</th><th>万方</th><th>万方</th></tr>
      </thead>
      <tbody>
        <tr><td class="grp" rowspan="2">长庆油田</td><td class="numc">38.50</td><td class="numc">39.12</td><td class="numc good">101.6</td><td class="numc">12,400</td><td class="numc">12,815</td><td class="numc good">103.3</td><td class="numc">5,200</td><td class="numc">5,186</td><td class="numc">61.2</td></tr>
        <tr><td class="sub">其中：页岩油</td><td class="numc">6.20</td><td class="numc">6.58</td><td class="numc good">106.1</td><td class="numc">—</td><td class="numc">—</td><td class="numc">—</td><td class="numc">—</td><td class="numc">—</td><td class="numc">58.4</td></tr>
        <tr><td class="grp" rowspan="2">华北油田</td><td class="numc">30.00</td><td class="numc">28.94</td><td class="numc bad">96.5</td><td class="numc">4,600</td><td class="numc">4,522</td><td class="numc bad">98.3</td><td class="numc">3,800</td><td class="numc">3,902</td><td class="numc">72.5</td></tr>
        <tr><td class="sub">其中：煤层气</td><td class="numc">—</td><td class="numc">—</td><td class="numc">—</td><td class="numc">1,050</td><td class="numc">1,183</td><td class="numc good">112.7</td><td class="numc">—</td><td class="numc">—</td><td class="numc">—</td></tr>
        <tr><td class="grp">塔里木油田</td><td class="numc">26.80</td><td class="numc">27.35</td><td class="numc good">102.1</td><td class="numc">9,800</td><td class="numc">10,064</td><td class="numc good">102.7</td><td class="numc">2,600</td><td class="numc">2,577</td><td class="numc">45.8</td></tr>
        <tr><td class="grp">大庆油田</td><td class="numc">24.50</td><td class="numc">23.86</td><td class="numc bad">97.4</td><td class="numc">1,200</td><td class="numc">1,156</td><td class="numc bad">96.3</td><td class="numc">6,100</td><td class="numc">6,240</td><td class="numc">83.1</td></tr>
        <tr class="subtotal"><td>小计（东部油田）</td><td class="numc">54.50</td><td class="numc">52.80</td><td class="numc bad">96.9</td><td class="numc">5,800</td><td class="numc">5,678</td><td class="numc bad">97.9</td><td class="numc">9,900</td><td class="numc">10,142</td><td class="numc">77.6</td></tr>
        <tr class="total"><td>合计</td><td class="numc">119.80</td><td class="numc">119.27</td><td class="numc">99.6</td><td class="numc">28,000</td><td class="numc">28,557</td><td class="numc good">102.0</td><td class="numc">17,700</td><td class="numc">17,905</td><td class="numc">66.4</td></tr>
      </tbody>
    </table>
    <div class="sheet-sub" style="padding:10px 0 14px">注：完成率 &lt; 100% 以红色标注；数据经行级权限过滤，仅展示当前用户可见油田。审核人：刘总 · 审核时间：2026-09-02 16:30</div>`;
  const SHEET_B = `
    <div class="sheet-title">2026 年 9 月 2 日 管网输量日报</div>
    <div class="sheet-sub"><span class="u">编制单位：管道分公司</span><span class="u">单位：万方</span><span class="u">报表编号：GS-2026-0902</span></div>
    <table class="sheet">
      <thead>
        <tr><th rowspan="2" class="slash"><i class="a">指标</i><i class="b">管线</i></th><th colspan="2">输气量</th><th rowspan="2">输差(%)</th><th rowspan="2">管存<br/>(万方)</th></tr>
        <tr><th>计划</th><th>实际</th></tr>
      </thead>
      <tbody>
        <tr><td class="grp">西一线（轮南—上海）</td><td class="numc">4,800</td><td class="numc">4,862</td><td class="numc good">1.29</td><td class="numc">6,420</td></tr>
        <tr><td class="grp">西二线（霍尔果斯—广州）</td><td class="numc">5,200</td><td class="numc">5,144</td><td class="numc bad">-1.08</td><td class="numc">7,015</td></tr>
        <tr><td class="grp">陕京线（榆林—北京）</td><td class="numc">3,600</td><td class="numc">3,688</td><td class="numc good">2.44</td><td class="numc">4,102</td></tr>
        <tr><td class="grp">中俄东线</td><td class="numc">2,900</td><td class="numc">2,905</td><td class="numc good">0.17</td><td class="numc">3,388</td></tr>
        <tr class="total"><td>合计</td><td class="numc">16,500</td><td class="numc">16,599</td><td class="numc good">0.60</td><td class="numc">20,925</td></tr>
      </tbody>
    </table>
    <div class="sheet-sub" style="padding:10px 0 14px">注：输差超出 ±1.5% 触发管网压力异常告警（AR-03）。数据更新于今天 07:30。</div>`;
  const SHEETS = { 'RP-01': SHEET_A, 'RP-02': SHEET_B };

  /* ================= 报表清单（GET /report/list） ================= */
  const RP_COL = { '交叉报表': ['var(--oil)', 'var(--oil-soft)'], '分组报表': ['var(--gas)', 'var(--gas-soft)'], '电子表格': ['var(--chem)', 'var(--chem-soft)'], '填报表单': ['var(--ok)', 'var(--ok-soft)'] };
  let REPORTS = [], curReport = null, fType = 'all';
  async function loadReports() {
    const box = document.getElementById('rpList');
    const stop = DG.ui.blockLoading(box);
    const r = await DG.api.get('/report/list');
    stop();
    if (r.code !== 0) { box.appendChild(DG.ui.errorBlock(r.message, loadReports)); return; }
    REPORTS = r.data;
    renderRpList();
    if (REPORTS.length) selectReport(REPORTS[0].id);
  }
  function renderRpList() {
    const rows = REPORTS.filter(r => fType === 'all' || r.type === fType);
    const box = document.getElementById('rpList');
    box.innerHTML = rows.length ? rows.map(r => {
      const [col, bg] = RP_COL[r.type] || ['var(--info)', 'var(--info-soft)'];
      return `<div class="rp-item ${curReport && curReport.id === r.id ? 'active' : ''}" data-id="${r.id}">
        <span class="r-ico" style="color:${col};background:${bg}">${DG.ICONS.report}</span>
        <div class="grow">
          <div class="r-name">${DG.ui.esc(r.name)}</div>
          <div class="r-sub">${r.type} · ${r.updated} · ${r.owner}</div>
        </div>
        <span class="tag ${r.subscribed ? 'brand' : ''}" style="align-self:flex-start">${r.subscribed ? '已订阅' : r.type}</span>
      </div>`;
    }).join('') : DG.ui.emptyBlock('该类型下暂无报表');
    box.querySelectorAll('.rp-item').forEach(el => el.onclick = () => selectReport(el.dataset.id));
  }
  function selectReport(id) {
    curReport = REPORTS.find(r => r.id === id);
    renderRpList();
    const wrap = document.getElementById('sheetWrap');
    const stop = DG.ui.blockLoading(wrap);
    setTimeout(() => {
      stop();
      wrap.innerHTML = SHEETS[id] || SHEET_A;
      document.getElementById('dsHint').textContent =
        `数据源：${id === 'RP-02' ? 'DS_管网输量 · 参数 \\${date}=2026-09-02' : 'DS_采油日报 · 参数 \\${month}=2026-08'} · 已按行级权限过滤`;
    }, 350);
  }

  /* ================= 类型 chips 过滤 ================= */
  document.querySelectorAll('#typeChips .seg-item').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#typeChips .seg-item').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      fType = c.dataset.t;
      renderRpList();
    });
  });

  /* ================= 工具条 ================= */
  async function exportReport(format, btn) {
    if (!curReport) return;
    DG.ui.btnLoading(btn, true);
    const r = await DG.api.post('/report/export', { name: curReport.name + '_202608', format });
    DG.ui.btnLoading(btn, false);
    if (r.code !== 0) { DG.ui.toast(r.message, 'err'); return; }
    DG.ui.toast(`已导出 ${r.data.file}（${r.data.size}）· 已附加导出水印：李明 2026-09-03`, 'ok');
  }
  document.getElementById('btnExpXls').onclick = e => exportReport('xlsx', e.currentTarget);
  document.getElementById('btnExpPdf').onclick = e => exportReport('pdf', e.currentTarget);
  document.getElementById('btnPush').onclick = () => {
    DG.ui.formModal({
      title: `定时推送 · ${curReport ? curReport.name : ''}`,
      fields: [
        { key: 'freq', label: '推送频率', type: 'select', options: ['每天 08:00', '每周一 09:00', '每月 1 日 10:00'].map(v => ({ v, t: v })) },
        { key: 'channel', label: '推送渠道', type: 'select', options: ['邮件', '企业微信', '钉钉'].map(v => ({ v, t: v })) },
        { key: 'receivers', label: '接收人组', required: true, placeholder: '如：生产管理部 · 24 人' }
      ],
      onSubmit: v => DG.ui.toast(`已创建推送：${v.freq} · ${v.channel} · ${v.receivers}`, 'ok')
    });
  };
  document.getElementById('btnPrint').onclick = () => DG.ui.toast('打印排版预览属 Phase 3 能力，见 PRD 10.10 · FR-RPT-08', 'warn');

  /* 条件格式 */
  const CF_RULES = [
    { field: '完成率(%)', cond: '<', val: '100', color: '红色' },
    { field: '完成率(%)', cond: '≥', val: '100', color: '绿色' },
  ];
  document.getElementById('btnCondFmt').onclick = () => {
    const body = DG.ui.el(`<div>
      <div id="cfList"></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-1)">
        <div class="form-label">+ 添加规则</div>
        <div class="flex" style="gap:8px">
          <select class="select" id="cfField" style="flex:1"><option>完成率(%)</option><option>实际产量</option><option>输差(%)</option></select>
          <select class="select" id="cfCond" style="width:80px"><option>&lt;</option><option>≥</option><option>介于</option></select>
          <input class="input" id="cfVal" style="width:90px" placeholder="100"/>
          <select class="select" id="cfColor" style="width:90px"><option>红色</option><option>绿色</option><option>黄色</option></select>
          <button class="btn sm" id="cfAdd">添加</button>
        </div>
      </div>
    </div>`);
    const CF_DOT = { '红色': 'var(--danger)', '绿色': 'var(--ok)', '黄色': 'var(--warn)' };
    function renderCf() {
      body.querySelector('#cfList').innerHTML = CF_RULES.map((r, i) => `
        <div class="cf-row">
          <i style="width:9px;height:9px;border-radius:50%;background:${CF_DOT[r.color]};flex:none"></i>
          <span class="grow">当 <b>${r.field}</b> ${r.cond} <b class="num">${r.val}</b> 时，文本标为 <b style="color:${CF_DOT[r.color]}">${r.color}</b></span>
          <span class="link" data-del="${i}" style="color:var(--danger)">删除</span>
        </div>`).join('');
      body.querySelectorAll('[data-del]').forEach(a => a.onclick = () => { CF_RULES.splice(+a.dataset.del, 1); renderCf(); });
    }
    renderCf();
    body.querySelector('#cfAdd').onclick = () => {
      const val = body.querySelector('#cfVal').value.trim();
      if (!val) { DG.ui.toast('请填写阈值', 'warn'); return; }
      CF_RULES.push({ field: body.querySelector('#cfField').value, cond: body.querySelector('#cfCond').value, val, color: body.querySelector('#cfColor').value });
      renderCf();
      DG.ui.toast('条件格式规则已添加，即时生效', 'ok');
    };
    DG.ui.modal({ title: '条件格式规则', width: 560, body, buttons: [{ label: '完 成', primary: true }] });
  };

  /* 新建报表 → 类型选择 → 企业版提示 */
  document.getElementById('btnNewRp').onclick = () => {
    const RT = [
      ['分组报表', '按维度分组汇总 + 小计合计', 'var(--gas)'],
      ['交叉报表', '行列交叉 · 多级表头', 'var(--oil)'],
      ['电子表格', '类 Excel 在线建模（企业版）', 'var(--chem)'],
      ['填报表单', '数据录入 · 审批流', 'var(--ok)'],
    ];
    const body = DG.ui.el(`<div class="grid g-2">${RT.map(t => `
      <div class="rp-item" data-t="${t[0]}" style="margin-bottom:0">
        <span class="r-ico" style="color:${t[2]};background:var(--bg-glass-2)">${DG.ICONS.report}</span>
        <div class="grow"><div class="r-name">${t[0]}</div><div class="r-sub">${t[1]}</div></div>
      </div>`).join('')}</div>`);
    body.querySelectorAll('.rp-item').forEach(c => c.onclick = () =>
      DG.ui.toast(`「${c.dataset.t}」报表设计器属企业版（P3），原型演示`, 'warn'));
    DG.ui.modal({ title: '新建报表 · 选择类型', width: 620, body, buttons: [{ label: '取 消' }] });
  };

  loadReports();

  /* #demo：自动打开条件格式 */
  if (location.hash === '#demo') setTimeout(() => document.getElementById('btnCondFmt').click(), 500);
</script>
</body>
</html>
