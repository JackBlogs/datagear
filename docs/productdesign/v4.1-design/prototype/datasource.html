<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据源 · DataGear 能源BI</title>
<link rel="stylesheet" href="assets/css/theme.css" />
<style>
  /* ---- 来源分类卡 ---- */
  .src-cats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .src-cat {
    display: flex; gap: 14px; align-items: center; padding: 16px 18px; cursor: pointer;
    background: var(--bg-glass); border: 1px solid var(--line-1); border-radius: var(--r-l);
    transition: all var(--dur); position: relative; overflow: hidden;
  }
  .src-cat:hover { border-color: var(--line-3); transform: translateY(-2px); box-shadow: var(--shadow-2); }
  .src-cat.sel { border-color: var(--brand); background: var(--brand-soft); }
  .src-cat::after { content:""; position:absolute; right:-26px; top:-26px; width:90px; height:90px; border-radius:50%; background:var(--cat-glow,rgba(255,138,61,.1)); filter:blur(10px); }
  .src-cat .c-icon { width: 44px; height: 44px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
  .src-cat .c-icon svg { width: 22px; height: 22px; }
  .src-cat .c-name { font-size: 14px; font-weight: 600; }
  .src-cat .c-name b { font-family: var(--font-num); font-size: 20px; margin-left: 6px; }
  .src-cat .c-sub { font-size: 11.5px; color: var(--tx-3); }
  /* ---- 规则提示条 ---- */
  .rule-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--info-soft); border: 1px solid rgba(96,165,250,.3);
    border-radius: var(--r-m); font-size: 12.5px; color: var(--tx-2);
  }
  .rule-bar svg { width: 15px; height: 15px; color: var(--info); flex: none; }
  .rule-bar b { color: var(--tx-1); font-weight: 600; }
  /* ---- 抽屉内容 ---- */
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,.06); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--tx-3); flex: none; }
  .kv .v { color: var(--tx-1); text-align: right; word-break: break-all; }
  .kv .v.mono { font-family: var(--font-mono); font-size: 12px; }
  .sec-label { font-size: 12px; color: var(--tx-3); letter-spacing: 1px; margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
  .sec-label svg { width: 13px; height: 13px; }
  .sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line-1); }
  /* ---- 向导 ---- */
  .steps { display: flex; align-items: center; gap: 8px; margin: 4px 0 20px; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tx-3); }
  .step .s-dot {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-family: var(--font-num); color: var(--tx-3); background: var(--bg-glass);
  }
  .step.active { color: var(--brand); font-weight: 600; }
  .step.active .s-dot { background: var(--brand-grad); color: #241105; border: none; box-shadow: var(--shadow-glow-brand); }
  .step.done { color: var(--ok); }
  .step.done .s-dot { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .step-line { flex: 1; height: 1px; background: var(--line-2); min-width: 24px; }
  .type-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .type-cell {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    border: 1px solid var(--line-1); border-radius: var(--r-m); cursor: pointer;
    background: var(--bg-glass); transition: all var(--dur);
  }
  .type-cell:hover { border-color: var(--brand-line); background: var(--bg-glass-2); }
  .type-cell.sel { border-color: var(--brand); background: var(--brand-soft); }
  .type-cell .t-logo {
    width: 32px; height: 32px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; font-family: var(--font-num); color: #0A0E17;
  }
  .type-cell .t-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .type-cell .t-sub { font-size: 10.5px; color: var(--tx-3); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .link { color: var(--brand); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  .link:hover { color: #FFB25E; }
  .link.danger { color: var(--danger); }
  /* 授权 chips */
  .g-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .g-chips .tag { cursor: pointer; padding: 5px 12px; font-size: 12px; }
  .g-chips .tag.on { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-line); }
  /* 测试结果条 */
  .test-result { border-radius: var(--r-m); padding: 12px 14px; font-size: 12.5px; line-height: 1.7; margin-top: 12px; }
  .test-result.ok { background: var(--ok-soft); border: 1px solid rgba(52,211,153,.3); color: var(--ok); }
  .test-result.err { background: var(--danger-soft); border: 1px solid rgba(248,113,113,.35); color: var(--danger); }
  @media (max-width: 1100px) { .src-cats { grid-template-columns: repeat(2,1fr); } .type-grid { grid-template-columns: repeat(3,1fr); } }
</style>
</head>
<body data-page="datasource">
<div id="page-content" style="display:none">

  <div class="page-head">
    <div>
      <div class="page-title">数据源管理</div>
      <div class="page-desc">统一管理数据库、文件、HTTP 接口与实时流，密码 AES 加密存储，支持信创数据库接入（PRD 10.1）</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="DG.ui.toast('原型演示：导出数据源清单','ok')">导出清单</button>
      <button class="btn primary" id="btnNewDs"><span id="plusIco" style="display:flex"></span>新建数据源</button>
    </div>
  </div>

  <!-- 业务规则提示条 -->
  <div class="rule-bar mb-3">
    <span id="ruleIco" style="display:flex"></span>
    <span><b>业务规则</b>：数据源默认仅创建者可见，需通过「授权」共享给其他用户或角色；连接密码支持加密存储（AES-256），元数据采集可单独开关。</span>
  </div>

  <!-- 来源分类统计（点击过滤表格，再点取消） -->
  <section class="src-cats mb-3" id="srcCats">
    <div class="src-cat" data-cat="数据库" style="--cat-glow:rgba(255,138,61,.12)">
      <div class="c-icon" style="color:var(--oil);background:var(--oil-soft)" data-ico="db"></div>
      <div><div class="c-name">数据库<b>18</b></div><div class="c-sub">MySQL · Oracle · 达梦 · 金仓…</div></div>
    </div>
    <div class="src-cat" data-cat="文件" style="--cat-glow:rgba(232,179,60,.12)">
      <div class="c-icon" style="color:var(--coal);background:var(--coal-soft)" data-ico="report"></div>
      <div><div class="c-name">文件<b>3</b></div><div class="c-sub">CSV · Excel · 目录文件</div></div>
    </div>
    <div class="src-cat" data-cat="HTTP接口" style="--cat-glow:rgba(96,165,250,.12)">
      <div class="c-icon" style="color:var(--info);background:var(--info-soft)" data-ico="api"></div>
      <div><div class="c-name">HTTP 接口<b>1</b></div><div class="c-sub">REST API · JSON 报文</div></div>
    </div>
    <div class="src-cat" data-cat="实时流" style="--cat-glow:rgba(34,211,238,.12)">
      <div class="c-icon" style="color:var(--gas);background:var(--gas-soft)" data-ico="flame"></div>
      <div><div class="c-name">实时流<b>1</b></div><div class="c-sub">Kafka · 消息队列</div></div>
    </div>
  </section>

  <!-- 筛选工具条 -->
  <div class="flex mb-2" style="gap:10px">
    <select class="select" id="stFilter" style="width:150px;font-size:12.5px;padding:7px 30px 7px 12px">
      <option value="all">全部状态</option>
      <option value="ok">连接正常</option>
      <option value="error">连接异常</option>
    </select>
    <input class="input" id="kwInput" style="width:250px;font-size:12.5px;padding:7px 12px" placeholder="搜索名称 / 类型 / 创建人…" />
    <span class="sm tx-3" id="cntHint" style="margin-left:auto"></span>
  </div>

  <!-- 数据源表格（GET /dtbsSource/list） -->
  <div class="table-wrap" id="dsWrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>数据源名称</th><th>类型</th><th>状态</th><th>表数量</th><th>创建人</th><th>可见性</th><th style="width:230px">操作</th>
        </tr>
      </thead>
      <tbody id="dsTbody"></tbody>
    </table>
  </div>

</div>

<script src="assets/js/vendor/echarts.min.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/mock-api.js"></script>
<script>
  document.getElementById('plusIco').innerHTML = DG.ICONS.plus;
  document.getElementById('ruleIco').innerHTML = DG.ICONS.spark;
  document.querySelectorAll('[data-ico]').forEach(el => el.innerHTML = DG.ICONS[el.dataset.ico]);

  /* ================= 数据与过滤 ================= */
  const TYPE_STYLE = {
    MySQL: ['var(--oil)', 'var(--oil-soft)'], Oracle: ['var(--chem)', 'var(--chem-soft)'],
    SQLServer: ['var(--info)', 'var(--info-soft)'], '达梦DM8': ['var(--gas)', 'var(--gas-soft)'],
    '金仓Kingbase': ['var(--ok)', 'var(--ok-soft)'], GaussDB: ['var(--chem)', 'var(--chem-soft)'],
    Hive: ['var(--coal)', 'var(--coal-soft)'], ClickHouse: ['var(--warn)', 'var(--warn-soft)'],
    Excel: ['var(--coal)', 'var(--coal-soft)'], CSV: ['var(--coal)', 'var(--coal-soft)'],
    HTTP: ['var(--info)', 'var(--info-soft)'], Kafka: ['var(--gas)', 'var(--gas-soft)']
  };
  const CAT_MAP = {
    '数据库': ['MySQL', 'Oracle', 'SQLServer', '达梦DM8', '金仓Kingbase', 'GaussDB', 'Hive', 'ClickHouse'],
    '文件': ['Excel', 'CSV'], 'HTTP接口': ['HTTP'], '实时流': ['Kafka']
  };
  let DS_ROWS = [], fCat = null, fSt = 'all', fKw = '';

  async function loadDs() {
    const wrap = document.getElementById('dsWrap');
    const stop = DG.ui.blockLoading(wrap);
    const r = await DG.api.get('/dtbsSource/list');
    stop();
    if (r.code !== 0) {
      document.getElementById('dsTbody').innerHTML = '';
      wrap.appendChild(DG.ui.errorBlock(r.message, loadDs));
      return;
    }
    DS_ROWS = r.data.rows;
    renderTable();
  }

  function renderTable() {
    const rows = DS_ROWS.filter(d => {
      if (fCat && !CAT_MAP[fCat].includes(d.type)) return false;
      if (fSt !== 'all' && d.status !== fSt) return false;
      if (fKw && !(d.name + d.type + d.owner).toLowerCase().includes(fKw)) return false;
      return true;
    });
    document.getElementById('cntHint').textContent = `共 ${rows.length} 个数据源` + (fCat ? ` · 已过滤：${fCat}` : '');
    const tb = document.getElementById('dsTbody');
    DG.ui.renderRows(tb, rows, d => {
      const [ic, bg] = TYPE_STYLE[d.type] || ['var(--info)', 'var(--info-soft)'];
      return `<tr data-id="${d.id}" style="cursor:pointer">
        <td><div class="flex" style="gap:10px">
          <span style="width:30px;height:30px;border-radius:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:${ic};background:${bg}">${DG.ICONS.db}</span>
          <span class="cell-main">${DG.ui.esc(d.name)}</span>
          ${d.xinchuang ? '<span class="tag brand">信创</span>' : ''}
        </div></td>
        <td><span class="tag">${DG.ui.esc(d.type)}</span></td>
        <td>${d.status === 'ok'
          ? '<span class="tag ok">连接正常</span>'
          : `<span class="tag danger">连接异常</span> <button class="btn sm" style="margin-left:6px" data-act="retry">重试</button>`}</td>
        <td class="num">${d.tables}</td>
        <td>${DG.ui.esc(d.owner)}</td>
        <td>${d.visibility === '私有' ? '<span class="tag">私有</span>' : '<span class="tag info">已共享</span>'}</td>
        <td data-ops>
          <span class="link" data-act="test">测试连接</span> ·
          <span class="link" data-act="grant">授权</span> ·
          <span class="link danger" data-act="del">删除</span>
        </td>
      </tr>`;
    });
    tb.querySelectorAll('tr[data-id]').forEach(tr => {
      const d = DS_ROWS.find(x => x.id === tr.dataset.id);
      tr.onclick = () => openDsDrawer(d);
      tr.querySelectorAll('[data-act]').forEach(a => a.onclick = e => { e.stopPropagation(); rowAction(a.dataset.act, d, a); });
    });
  }

  /* 顶部来源卡过滤（再点取消） */
  document.querySelectorAll('#srcCats .src-cat').forEach(c => {
    c.onclick = () => {
      const cat = c.dataset.cat;
      fCat = (fCat === cat) ? null : cat;
      document.querySelectorAll('#srcCats .src-cat').forEach(x => x.classList.toggle('sel', x.dataset.cat === fCat));
      renderTable();
    };
  });
  document.getElementById('stFilter').onchange = e => { fSt = e.target.value; renderTable(); };
  document.getElementById('kwInput').oninput = e => { fKw = e.target.value.trim().toLowerCase(); renderTable(); };

  /* ================= 行内操作 ================= */
  async function testConn(d) {
    DG.ui.toast(`正在测试「${d.name}」连接…`);
    const r = await DG.api.post('/dtbsSource/test', { type: d.type, url: d.url });
    if (r.code === 0) DG.ui.toast(`连接成功 · 耗时 ${r.data.connectMs}ms · ${r.data.version}`, 'ok');
    else DG.ui.toast(r.message, 'err');
  }
  async function rowAction(act, d, el) {
    if (act === 'test' || act === 'retry') { testConn(d); return; }
    if (act === 'grant') { openGrant(d); return; }
    if (act === 'del') {
      const okDel = await DG.ui.confirm({
        danger: true, title: '删除数据源', okLabel: '确认删除',
        content: `即将删除数据源「<b>${DG.ui.esc(d.name)}</b>」。删除后其下数据集将失去连接，引用看板会显示数据异常。`
      });
      if (!okDel) return;
      const r = await DG.api.del('/dtbsSource/' + d.id);
      if (r.code === 0) {
        DS_ROWS = DS_ROWS.filter(x => x.id !== d.id);
        renderTable();
        DG.ui.toast(`数据源「${d.name}」已删除`, 'ok');
      } else DG.ui.toast(r.message, 'err');
    }
  }

  /* ================= 授权共享 ================= */
  function openGrant(d) {
    const GRANTEES = {
      '角色': ['数据分析师', '业务人员', '数据工程师', '决策层'],
      '用户': ['李明', '王芳', '张伟', '赵静', '陈磊']
    };
    const body = DG.ui.el(`<div>
      <div class="form-item">
        <label class="form-label">授权对象类型</label>
        <select class="select" id="gType"><option>角色</option><option>用户</option></select>
      </div>
      <div class="form-item">
        <label class="form-label">选择对象（可多选）</label>
        <div class="g-chips" id="gChips"></div>
      </div>
      <div class="form-item">
        <label class="form-label">权限级别</label>
        <select class="select" id="gPerm">
          <option>无权限</option><option selected>只读</option><option>读写</option><option>管理</option>
        </select>
        <div class="form-hint">只读：可基于该数据源创建数据集；读写：可写回填报数据；管理：可编辑连接与授权</div>
      </div>
    </div>`);
    const chipsEl = body.querySelector('#gChips');
    function renderChips(t) {
      chipsEl.innerHTML = GRANTEES[t].map((g, i) => `<span class="tag ${i === 0 ? 'on' : ''}">${g}</span>`).join('');
      chipsEl.querySelectorAll('.tag').forEach(c => c.onclick = () => c.classList.toggle('on'));
    }
    renderChips('角色');
    body.querySelector('#gType').onchange = e => renderChips(e.target.value);
    DG.ui.modal({
      title: `授权共享 · ${d.name}`, width: 520, body,
      buttons: [{ label: '取 消' }, {
        label: '确认授权', primary: true, onClick: () => {
          const sel = [...chipsEl.querySelectorAll('.tag.on')].map(x => x.textContent);
          if (!sel.length) { DG.ui.toast('请至少选择一个授权对象', 'warn'); return false; }
          DG.ui.toast(`已将「${d.name}」以「${body.querySelector('#gPerm').value}」授权给 ${sel.join('、')}`, 'ok');
        }
      }]
    });
  }

  /* ================= 详情抽屉 ================= */
  function openDsDrawer(d) {
    const health = (d.health && d.health.length === 7) ? d.health : [100, 100, 100, 100, 100, 100, 100];
    const body = DG.ui.el(`<div>
      <div class="sec-label">${DG.ICONS.db}连接信息</div>
      <div class="card" style="padding:6px 14px">
        <div class="kv"><span class="k">连接地址</span><span class="v mono">${DG.ui.esc(d.url)}</span></div>
        <div class="kv"><span class="k">数据库类型</span><span class="v">${DG.ui.esc(d.type)}${d.xinchuang ? ' <span class="tag brand">信创</span>' : ''}</span></div>
        <div class="kv"><span class="k">驱动版本</span><span class="v mono">${DG.ui.esc(d.driver)}</span></div>
        <div class="kv"><span class="k">账号</span><span class="v mono">dg_readonly</span></div>
        <div class="kv"><span class="k">密码</span><span class="v"><span class="tag ok">AES-256 加密存储</span></span></div>
        <div class="kv"><span class="k">字符集 / 时区</span><span class="v mono">utf8mb4 · GMT+8</span></div>
      </div>
      <div class="sec-label">${DG.ICONS.dataset}元数据采集</div>
      <div class="card" style="padding:12px 14px">
        <div class="flex-between">
          <div>
            <div style="font-size:13px;font-weight:600">自动采集表 / 字段元数据</div>
            <div class="sm tx-3">每天 02:00 全量采集，变更自动同步至数据治理目录</div>
          </div>
          <label class="switch"><input type="checkbox" checked id="metaSw"/><i></i></label>
        </div>
      </div>
      <div class="sec-label">${DG.ICONS.metric}近 7 日连接健康度</div>
      <div class="card" style="padding:12px 14px 4px">
        <div class="chart" style="height:150px;min-height:150px" id="dHealth"></div>
        <div class="flex-between sm tx-3" style="padding:8px 0 10px">
          <span>可用率 <b class="num" style="color:${health[6] >= 99 ? 'var(--ok)' : 'var(--danger)'}">${health[6]}%</b></span>
          <span>平均响应 <b class="num" style="color:var(--tx-1)">18ms</b></span>
          <span>失败 <b class="num" style="color:var(--danger)">${d.status === 'error' ? '3' : '0'} 次</b></span>
        </div>
      </div>
    </div>`);
    body.querySelector('#metaSw').onchange = e =>
      DG.ui.toast(e.target.checked ? `「${d.name}」元数据采集已开启（每天 02:00 全量）` : `「${d.name}」元数据采集已停用`, 'ok');
    const dr = DG.ui.drawer({
      title: `${d.name}（${d.id}）`, width: 500, body, footer: true,
      buttons: [
        { label: '编 辑', onClick: () => { openEdit(d); return false; } },
        {
          label: '测试连接', primary: true, keepOpen: true,
          onClick: async (api, btn) => {
            DG.ui.btnLoading(btn, true);
            const r = await DG.api.post('/dtbsSource/test', { type: d.type, url: d.url });
            DG.ui.btnLoading(btn, false);
            if (r.code === 0) DG.ui.toast(`连接成功 · 耗时 ${r.data.connectMs}ms`, 'ok');
            else DG.ui.toast(r.message, 'err');
          }
        }
      ]
    });
    setTimeout(() => {
      const c = DG.makeChart(body.querySelector('#dHealth'), {
        grid: { left: 4, right: 8, top: 26, bottom: 2, containLabel: true },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: DG.WEEK },
        yAxis: { type: 'value', min: 55, max: 102, name: '%', nameTextStyle: { color: '#7C88A0' } },
        series: [{
          name: '连接成功率', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5, data: health,
          lineStyle: { width: 2.5, color: health[6] >= 99 ? '#34D399' : '#F87171' }, itemStyle: { color: health[6] >= 99 ? '#34D399' : '#F87171' },
          areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(52,211,153,.25)' }, { offset: 1, color: 'rgba(52,211,153,0)' }] } }
        }]
      });
      setTimeout(() => c && c.resize(), 340);
    }, 90);
  }

  /* ================= 编辑（预填表单） ================= */
  function openEdit(d) {
    DG.ui.formModal({
      title: `编辑数据源 · ${d.id}`,
      fields: [
        { key: 'name', label: '数据源名称', required: true, value: d.name },
        { key: 'url', label: '连接地址', required: true, value: d.url, hint: 'JDBC / Kafka / 文件路径格式，修改后自动重新测试连接' },
        { key: 'user', label: '用户名', value: 'dg_readonly' },
        { key: 'pwd', label: '密码', type: 'password', placeholder: '不修改请留空' }
      ],
      onSubmit: async v => {
        d.name = v.name; d.url = v.url;
        renderTable();
        DG.ui.toast(`数据源「${v.name}」已保存`, 'ok');
      }
    });
  }

  /* ================= 新建数据源 · 四步向导 ================= */
  const DB_TYPES = [
    ['MySQL', '开源关系库', '#FF8A3D'], ['Oracle', '商用关系库', '#F87171'], ['SQLServer', '微软关系库', '#60A5FA'],
    ['达梦DM8', '信创关系库', '#22D3EE'], ['金仓Kingbase', '信创关系库', '#34D399'], ['GaussDB', '华为信创库', '#A78BFA'],
    ['Hive', '大数据仓库', '#E8B33C'], ['ClickHouse', '实时分析库', '#F472B6'],
  ];
  const OTHER_TYPES = [
    ['CSV', '单文件', '#E8B33C'], ['Excel', '工作簿', '#34D399'], ['HTTP', 'REST 接口', '#60A5FA'], ['Kafka', '实时消息流', '#22D3EE'],
  ];
  const URL_PH = {
    MySQL: 'jdbc:mysql://host:3306/dbname', Oracle: 'jdbc:oracle:thin:@host:1521:SID',
    SQLServer: 'jdbc:sqlserver://host:1433;db=dbname', '达梦DM8': 'jdbc:dm://host:5236/dbname',
    '金仓Kingbase': 'jdbc:kingbase8://host:54321/dbname', GaussDB: 'jdbc:postgresql://host:8000/dbname',
    Hive: 'jdbc:hive2://host:10000/dbname', ClickHouse: 'jdbc:clickhouse://host:8123/dbname',
    CSV: 'file:///shared/path/*.csv', Excel: 'file:///shared/path/*.xlsx',
    HTTP: 'https://api.example.com/data', Kafka: 'kafka://host:9092/topic'
  };
  function openWizard() {
    const st = { step: 1, type: '', name: '', url: '', user: '', pwd: '', tested: false };
    const m = DG.ui.modal({ title: '新建数据源', width: 740, footer: false, body: '<div id="wzBody"></div>' });
    const body = m.body.querySelector('#wzBody');
    const stepsBar = () => `<div class="steps">${['选择类型', '填写连接', '连接测试', '完成'].map((s, i) =>
      `<div class="step ${st.step === i + 1 ? 'active' : st.step > i + 1 ? 'done' : ''}"><span class="s-dot">${i + 1}</span>${s}</div>${i < 3 ? '<span class="step-line"></span>' : ''}`).join('')}</div>`;
    const typeCell = t => `
      <div class="type-cell ${st.type === t[0] ? 'sel' : ''}" data-t="${t[0]}">
        <div class="t-logo" style="background:${t[2]}">${t[0].slice(0, 2).toUpperCase()}</div>
        <div><div class="t-name">${t[0]}</div><div class="t-sub">${t[1]}</div></div>
      </div>`;

    function render() {
      if (st.step === 1) {
        body.innerHTML = stepsBar() + `
          <div class="form-label" style="margin-bottom:10px">数据库类（含信创）</div>
          <div class="type-grid" id="wzG1">${DB_TYPES.map(typeCell).join('')}</div>
          <div class="form-label" style="margin:16px 0 10px">文件 / 接口 / 流</div>
          <div class="type-grid" id="wzG2">${OTHER_TYPES.map(typeCell).join('')}</div>
          <div class="modal-foot">
            <button class="btn" data-x>取 消</button>
            <button class="btn primary" data-next>下一步</button>
          </div>`;
        body.querySelectorAll('.type-cell').forEach(c => c.onclick = () => {
          st.type = c.dataset.t;
          body.querySelectorAll('.type-cell').forEach(x => x.classList.toggle('sel', x.dataset.t === st.type));
        });
        body.querySelector('[data-x]').onclick = () => m.close();
        body.querySelector('[data-next]').onclick = () => {
          if (!st.type) { DG.ui.toast('请先选择数据源类型', 'warn'); return; }
          st.step = 2; render();
        };
      } else if (st.step === 2) {
        body.innerHTML = stepsBar() + `
          <div class="form-item"><label class="form-label"><span class="req">*</span>数据源名称</label>
            <input class="input" id="wzName" value="${DG.ui.esc(st.name)}" placeholder="如：华北油田生产库"/>
            <div class="field-error hidden" id="eName"></div></div>
          <div class="form-item"><label class="form-label"><span class="req">*</span>连接地址</label>
            <input class="input" id="wzUrl" value="${DG.ui.esc(st.url)}" placeholder="${URL_PH[st.type] || ''}"/>
            <div class="form-hint">${['Kafka', 'HTTP', 'CSV', 'Excel'].includes(st.type) ? '按类型填写 broker / URL / 文件路径' : 'JDBC 格式：jdbc:&lt;子协议&gt;://&lt;主机&gt;:&lt;端口&gt;/&lt;库名&gt;，密码将 AES-256 加密存储'}</div>
            <div class="field-error hidden" id="eUrl"></div></div>
          <div class="grid g-2">
            <div class="form-item"><label class="form-label">用户名</label>
              <input class="input" id="wzUser" value="${DG.ui.esc(st.user)}" placeholder="dg_readonly"/></div>
            <div class="form-item"><label class="form-label">密码</label>
              <input class="input" type="password" id="wzPwd" value="${DG.ui.esc(st.pwd)}" placeholder="连接密码"/></div>
          </div>
          <div class="modal-foot">
            <button class="btn" data-prev>上一步</button>
            <button class="btn primary" data-next>下一步</button>
          </div>`;
        body.querySelector('[data-prev]').onclick = () => { st.step = 1; render(); };
        body.querySelector('[data-next]').onclick = () => {
          const name = body.querySelector('#wzName').value.trim(), url = body.querySelector('#wzUrl').value.trim();
          let ok = true;
          const eN = body.querySelector('#eName'), eU = body.querySelector('#eUrl');
          eN.classList.add('hidden'); eU.classList.add('hidden');
          if (!name) { eN.textContent = '数据源名称不能为空'; eN.classList.remove('hidden'); body.querySelector('#wzName').classList.add('err'); ok = false; }
          if (!url) { eU.textContent = '连接地址不能为空'; eU.classList.remove('hidden'); body.querySelector('#wzUrl').classList.add('err'); ok = false; }
          else if (!['Kafka', 'HTTP', 'CSV', 'Excel'].includes(st.type) && !url.startsWith('jdbc:')) {
            eU.textContent = 'JDBC 地址须以 jdbc: 开头，如 ' + (URL_PH[st.type] || ''); eU.classList.remove('hidden'); body.querySelector('#wzUrl').classList.add('err'); ok = false;
          }
          if (!ok) return;
          st.name = name; st.url = url;
          st.user = body.querySelector('#wzUser').value.trim(); st.pwd = body.querySelector('#wzPwd').value;
          st.step = 3; st.tested = false; render();
        };
      } else if (st.step === 3) {
        body.innerHTML = stepsBar() + `
          <div class="card" style="padding:12px 14px;background:var(--bg-glass-2)">
            <div class="kv"><span class="k">类型</span><span class="v">${st.type}${['达梦DM8', '金仓Kingbase', 'GaussDB'].includes(st.type) ? ' <span class="tag brand">信创</span>' : ''}</span></div>
            <div class="kv"><span class="k">名称</span><span class="v">${DG.ui.esc(st.name)}</span></div>
            <div class="kv"><span class="k">地址</span><span class="v mono">${DG.ui.esc(st.url)}</span></div>
          </div>
          <div id="wzTestBox"></div>
          <div class="modal-foot">
            <button class="btn" data-prev>上一步</button>
            <button class="btn" data-test>测试连接</button>
            <button class="btn primary" data-next disabled id="wzNext3">下一步</button>
          </div>`;
        body.querySelector('[data-prev]').onclick = () => { st.step = 2; render(); };
        body.querySelector('[data-test]').onclick = async e => {
          const btn = e.currentTarget, box = body.querySelector('#wzTestBox');
          DG.ui.btnLoading(btn, true);
          box.innerHTML = '';
          const r = await DG.api.post('/dtbsSource/test', { type: st.type, url: st.url });
          DG.ui.btnLoading(btn, false);
          if (r.code === 0) {
            st.tested = true;
            body.querySelector('#wzNext3').disabled = false;
            box.innerHTML = `<div class="test-result ok">✓ ${r.data.version} · 耗时 <b class="num">${r.data.connectMs}ms</b>，可进入下一步</div>`;
          } else {
            st.tested = false;
            body.querySelector('#wzNext3').disabled = true;
            box.innerHTML = `<div class="test-result err">✕ ${DG.ui.esc(r.message)}
              <div style="margin-top:8px"><button class="btn sm danger" data-retry>重 试</button>
              <span class="sm" style="margin-left:10px;color:var(--tx-3)">GaussDB 演示实例网络不可达，重试仍失败可返回修改地址</span></div></div>`;
            box.querySelector('[data-retry]').onclick = () => body.querySelector('[data-test]').click();
          }
        };
        body.querySelector('[data-next]').onclick = () => { if (st.tested) { st.step = 4; render(); } };
      } else {
        body.innerHTML = stepsBar() + `
          <div class="test-result ok" style="margin-top:0">连接测试已通过，确认信息后完成创建。创建后默认仅自己可见，可在列表中「授权」共享。</div>
          <div class="card" style="padding:12px 14px;margin-top:12px;background:var(--bg-glass-2)">
            <div class="kv"><span class="k">数据源名称</span><span class="v">${DG.ui.esc(st.name)}</span></div>
            <div class="kv"><span class="k">类型 / 地址</span><span class="v mono">${st.type} · ${DG.ui.esc(st.url)}</span></div>
            <div class="kv"><span class="k">元数据采集</span><span class="v">默认开启 · 每天 02:00</span></div>
          </div>
          <div class="modal-foot">
            <button class="btn" data-prev>上一步</button>
            <button class="btn primary" data-done>完成创建</button>
          </div>`;
        body.querySelector('[data-prev]').onclick = () => { st.step = 3; render(); };
        body.querySelector('[data-done]').onclick = async e => {
          const btn = e.currentTarget;
          DG.ui.btnLoading(btn, true);
          const r = await DG.api.post('/dtbsSource/save', { name: st.name, url: st.url, type: st.type });
          DG.ui.btnLoading(btn, false);
          if (r.code !== 0) { DG.ui.toast(r.message, 'err'); return; }
          DS_ROWS.push(r.data);
          renderTable();
          m.close();
          DG.ui.toast(`数据源「${st.name}」创建成功（${r.data.id}），已开启元数据采集`, 'ok');
        };
      }
    }
    render();
  }
  document.getElementById('btnNewDs').onclick = openWizard;

  loadDs();

  /* #demo：自动打开新建数据源向导 */
  if (location.hash === '#demo') setTimeout(openWizard, 400);
</script>
</body>
</html>
